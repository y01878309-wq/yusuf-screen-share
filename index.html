<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnyDesk Web | يوسف فرج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #0f1115; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [myId, setMyId] = useState('');
      const [remoteInput, setRemoteInput] = useState('');
      const [status, setStatus] = useState('جاري الاتصال بالسيرفر...');
      const [incomingCall, setIncomingCall] = useState(null);
      const [showModal, setShowModal] = useState(false);

      const socketRef = useRef(null);
      const pcRef = useRef(null);
      const localStreamRef = useRef(null);
      const remoteVideoRef = useRef(null);

      const rtcConfig = {
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      };

      useEffect(() => {
        const socket = io('https://Yusuf-screen-share-production-fc10.up.railway.app');
        socketRef.current = socket;

        socket.on('connect', () => {
          const generatedId = Math.floor(100 + Math.random() * 900) + ' ' + Math.floor(100 + Math.random() * 900) + ' ' + Math.floor(100 + Math.random() * 900);
          setMyId(generatedId);
          socket.emit('register_id', generatedId);
          setStatus('جاهز. أدخل رقم الطرف الآخر بالأسفل.');
        });

        socket.on('incoming_offer', async ({ from, offer }) => {
          setStatus(`طلب اتصال وارد من: ${from}`);
          setIncomingCall({ from, offer });
          setShowModal(true);
        });

        socket.on('incoming_answer', async ({ answer }) => {
          if (pcRef.current) {
            await pcRef.current.setRemoteDescription(new RTCSessionDescription(answer));
            setStatus('تم الاتصال بنجاح وعرض الشاشة!');
          }
        });

        socket.on('incoming_candidate', async ({ candidate }) => {
          if (pcRef.current && candidate) {
            try {
              await pcRef.current.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (e) { console.error(e); }
          }
        });

        return () => socket.disconnect();
      }, []);

      const createPeerConnection = (receiverId) => {
        if (pcRef.current) return pcRef.current;
        const pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (e) => {
          if (e.candidate && socketRef.current) {
            socketRef.current.emit('send_candidate', { target: receiverId, candidate: e.candidate });
          }
        };

        pc.ontrack = (e) => {
          if (remoteVideoRef.current && e.streams[0]) {
            remoteVideoRef.current.srcObject = e.streams[0];
            setStatus('تتم الآن مشاهدة الشاشة بنجاح!');
          }
        };

        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(track => {
            pc.addTrack(track, localStreamRef.current);
          });
        }

        pcRef.current = pc;
        return pc;
      };

      const startCapture = async () => {
        if (localStreamRef.current) return localStreamRef.current;
        try {
          let stream;
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          } catch (e) {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          }
          localStreamRef.current = stream;
          return stream;
        } catch (err) {
          alert('تعذر الحصول على صلاحية مشاركة الشاشة أو الكاميرا.');
          throw err;
        }
      };

      const handleConnect = async () => {
        const cleanId = remoteInput.trim();
        if (!cleanId) return alert('الرجاء إدخال رقم العنوان المطلوب!');
        
        setStatus('جاري تجهيز البث والاتصال...');
        await startCapture();

        const pc = createPeerConnection(cleanId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        socketRef.current.emit('send_offer', { target: cleanId, from: myId, offer });
      };

      const acceptCall = async () => {
        setShowModal(false);
        setStatus('جاري بدء المشاركة والقبول...');
        await startCapture();

        const pc = createPeerConnection(incomingCall.from);
        await pc.setRemoteDescription(new RTCSessionDescription(incomingCall.offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        socketRef.current.emit('send_answer', { target: incomingCall.from, answer });
        setStatus('متصل ويتم بث الشاشة الآن.');
      };

      const rejectCall = () => {
        setShowModal(false);
        setIncomingCall(null);
        setStatus('تم رفض الاتصال.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#161922] text-slate-100 p-4">
          
          {/* نافذة الموافقة */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-[#1e222d] border border-red-500/40 p-6 rounded-2xl max-w-sm w-full shadow-2xl flex flex-col gap-4 text-center">
                <div className="text-xl font-bold text-white">طلب اتصال وارد</div>
                <p className="text-xs text-slate-300">الجهاز ({incomingCall?.from}) يطلب الاتصال بك وعرض الشاشة.</p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={rejectCall} className="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white py-2.5 rounded-xl font-bold text-xs transition">رفض</button>
                  <button onClick={acceptCall} className="bg-green-600 hover:bg-green-500 text-white py-2.5 rounded-xl font-bold text-xs transition">قبول</button>
                </div>
              </div>
            </div>
          )}

          {/* شريط الإدخال الرئيسي مثل AnyDesk */}
          <header className="w-full max-w-xl mx-auto mb-6 flex flex-col gap-4">
            <div className="bg-[#1e222d] rounded-2xl p-4 shadow-xl border border-slate-800 flex items-center gap-2">
              <svg className="w-6 h-6 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input 
                type="text" 
                placeholder="Enter Remote Address" 
                value={remoteInput}
                onChange={(e) => setRemoteInput(e.target.value)}
                className="w-full bg-transparent text-white font-mono text-base tracking-widest placeholder-slate-500 focus:outline-none text-center"
              />
              <button onClick={handleConnect} className="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs tracking-wider shrink-0 transition shadow-lg">
                اتصال
              </button>
            </div>

            {/* خانة Your Address */}
            <div className="bg-[#1e222d] rounded-2xl p-6 shadow-xl border border-slate-800 text-center flex flex-col items-center">
              <span className="text-xs text-slate-400 font-semibold mb-1">Your Address</span>
              <div className="text-3xl sm:text-4xl font-black font-mono text-red-500 tracking-wider my-1">
                {myId || 'جاري التحميل...'}
              </div>
              <span className="text-[11px] text-slate-500 mt-2">شارك هذا الرقم مع الجهاز الآخر ليتصل بك</span>
            </div>
          </header>

          {/* حالة الاتصال */}
          <div className="w-full max-w-xl mx-auto mb-4 bg-[#1e222d]/60 border border-slate-800 py-2 px-4 rounded-xl text-center text-xs text-slate-300 font-mono">
            {status}
          </div>

          {/* شاشة العرض الأساسية */}
          <main className="w-full max-w-xl mx-auto flex-1 flex flex-col mb-4">
            <div className="bg-[#1e222d] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative flex-1 min-h-[320px] flex items-center justify-center">
              <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-contain"></video>
              <div className="absolute inset-0 flex items-center justify-center bg-[#161922]/90 p-4 text-center text-xs text-slate-500 pointer-events-none" style={{ opacity: remoteVideoRef.current?.srcObject ? 0 : 1 }}>
                ستظهر شاشة الطرف الآخر هنا مباشرة فور الاتصال.
              </div>
            </div>
          </main>

          <footer className="text-center text-[10px] text-slate-600 pb-2">
            AnyDesk Web Engine | تصميم وتطوير: يوسف فرج
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
