<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenCast Manual Connect Link | يوسف فرج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #020617; color: #f8fafc; }
    .neon-border { border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 0 35px rgba(99, 102, 241, 0.25); }
    .glass-box { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [myId, setMyId] = useState('جاري توليد الكود...');
      const [targetId, setTargetId] = useState('');
      const [connectionStatus, setConnectionStatus] = useState('في انتظار الاتصال بالمكتبة...');
      const [isStreaming, setIsStreaming] = useState(false);

      const peerRef = useRef(null);
      const localStreamRef = useRef(null);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);

      useEffect(() => {
        // إنشاء كينونة PeerJS بمعرف عشوائي فريد لكل تليفون بدون تضارب
        const peer = new Peer({
          config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (id) => {
          setMyId(id);
          setConnectionStatus('متصل وجاهز. شارك كود هاتفك أو اكتب كود الطرف الآخر.');
        });

        // استقبال الاتصال وبث الشاشة تلقائياً لو حد اتصل بك
        peer.on('call', (call) => {
          setConnectionStatus('جاري استقبال البث من الجهاز الآخر...');
          call.answer(); // الرد على الاتصال
          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) {
              remoteVideoRef.current.srcObject = remoteStream;
              setConnectionStatus('✓ تم عرض الشاشة الرئيسية بنجاح!');
              setIsStreaming(true);
            }
          });
        });

        peer.on('error', (err) => {
          console.error(err);
          setConnectionStatus('خطأ في الشبكة: ' + err.type);
        });

        peerRef.current = peer;

        return () => {
          peer.destroy();
        };
      }, []);

      // دالة الاتصال بالجهاز الآخر باستخدام الكود الخاص به
      const connectToTarget = () => {
        if (!targetId.trim()) {
          alert('يرجى كتابة كود الجهاز الثاني أولاً!');
          return;
        }

        setConnectionStatus('جاري طلب الاتصال بشاشة الجهاز الآخر...');

        navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true }).then((stream) => {
          localStreamRef.current = stream;
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = stream;
          }

          const peer = peerRef.current;
          const call = peer.call(targetId.trim(), stream);

          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) {
              remoteVideoRef.current.srcObject = remoteStream;
            }
          });

          setIsStreaming(true);
          setConnectionStatus('✓ تم ربط الشاشة وإرسال البث بنجاح!');

          stream.getVideoTracks()[0].onended = () => {
            stopBroadcast();
          };
        }).catch(err => {
          console.error(err);
          setConnectionStatus('فشل البدء أو تم إلغاء إذن الشاشة.');
        });
      };

      const stopBroadcast = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(t => t.stop());
          localStreamRef.current = null;
        }
        setIsStreaming(false);
        setConnectionStatus('تم إيقاف البث.');
      };

      const copyMyId = () => {
        navigator.clipboard.writeText(myId);
        alert('تم نسخ كود هاتفك بنجاح! ابعته للجهاز التاني.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* Header */}
          <header className="glass-box border-b border-slate-800 p-4 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg neon-border">
                  🛰️
                </div>
                <div>
                  <h1 className="text-sm font-black text-white">ScreenCast Manual Connect</h1>
                  <p className="text-xs text-slate-400">هندسة: <strong className="text-indigo-300">يوسف فرج</strong></p>
                </div>
              </div>

              {/* كود هاتفك وزر النسخ */}
              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                <span className="text-[11px] text-slate-400">كود هاتفك:</span>
                <span className="text-xs font-mono text-emerald-400 font-bold">{myId}</span>
                <button onClick={copyMyId} className="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] px-2.5 py-1 rounded-lg font-bold">
                  نسخ الكود
                </button>
              </div>
            </div>
          </header>

          {/* Status Bar */}
          <div className="bg-slate-900/60 border-b border-slate-900 px-6 py-2">
            <div className="max-w-7xl mx-auto text-xs font-mono text-slate-400 text-center">
              حالة الاتصال: <strong className="text-emerald-400">{connectionStatus}</strong>
            </div>
          </div>

          {/* Main Workspace */}
          <main className="flex-1 flex flex-col items-center justify-center p-6 gap-6">
            
            {/* خانة إدخال كود الجهاز الثاني للربط */}
            <div className="w-full max-w-xl bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row gap-3 shadow-xl">
              <input 
                type="text" 
                placeholder="حط هنا كود الجهاز الثاني لتتصل به..." 
                value={targetId}
                onChange={(e) => setTargetId(e.target.value)}
                className="flex-1 bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-xl text-xs text-white font-mono focus:outline-none focus:border-indigo-500"
              />
              <button 
                onClick={connectToTarget}
                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-6 py-2.5 rounded-xl font-bold transition shadow-lg">
                🔗 اتصال وبدء العرض
              </button>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full max-w-5xl">
              
              {/* شاشة هاتفك (المصدر) */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col shadow-xl">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-indigo-400">📱 شاشة هاتفك (المصدر للبث)</span>
                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                </div>

                <div className="w-full h-[320px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={localVideoRef} autoPlay playsInline muted className="w-full h-full object-contain"></video>
                  {!isStreaming && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-6 text-center">
                      <span className="text-4xl mb-3">📡</span>
                      <p className="text-xs text-slate-300">ضع كود الجهاز الآخر في الخانة بالأعلى واضغط "اتصال وبدء العرض" لتظهر شاشتك عنده.</p>
                    </div>
                  )}
                </div>
              </div>

              {/* الشاشة الرئيسية (تستقبل شاشة الطرف الآخر) */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col shadow-xl">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-emerald-400">💻 الشاشة الرئيسية (تظهر هنا شاشة الطرف الآخر)</span>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>

                <div className="w-full h-[320px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-contain"></video>
                  <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-6 text-center pointer-events-none">
                    <span className="text-4xl mb-3">🖥️</span>
                    <p className="text-xs text-slate-400">ستظهر الشاشة الرئيسية للجهاز الثاني هنا فور اتصاله بك.</p>
                  </div>
                </div>
              </div>

            </div>
          </main>

          {/* Footer */}
          <footer className="glass-box border-t border-slate-800 p-4 text-center text-xs text-slate-400">
            تطوير وهندسة الاتصال المباشر: <strong className="text-white">يوسف فرج</strong>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
