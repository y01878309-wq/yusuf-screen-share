<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenCast Free WebSockets | يوسف فرج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- مكتبة Socket.io للإشارة المجانية السريعة -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #020617; color: #f8fafc; }
    .neon-border { border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 0 35px rgba(99, 102, 241, 0.25); }
    .glass-box { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [roomId, setRoomId] = useState('');
      const [inputRoom, setInputRoom] = useState('');
      const [status, setStatus] = useState('جاري الاتصال بسيرفر الإشارة المجاني...');
      const [isStreaming, setIsStreaming] = useState(false);

      const socketRef = useRef(null);
      const pcRef = useRef(null);
      const localStreamRef = useRef(null);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);

      useEffect(() => {
        // الاتصال بسيرفر إشارة مجاني عام ومستقر
        const socket = io('https://socket-signaling-server-example.onrender.com' || 'https://youssef-signaling.glitch.me');
        // لو السيرفر العام مش متاح، هندير الاتصال عبر الغرف المباشرة
        socketRef.current = socket;

        socket.on('connect', () => {
          setStatus('متصل بنجاح بالسيرفر. أنشئ غرفة أو انضم لغرفة.');
        });

        socket.on('joined', (room) => {
          setRoomId(room);
          setStatus(`✓ تم الانضمام للغرفة بنجاح: ${room}`);
        });

        socket.on('offer', async (offer) => {
          setStatus('جاري استقبال طلب الاتصال...');
          await createPeerConnection();
          await pcRef.current.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pcRef.current.createAnswer();
          await pcRef.current.setLocalDescription(answer);
          socketRef.current.emit('answer', { room: roomId, answer });
        });

        socket.on('answer', async (answer) => {
          await pcRef.current.setRemoteDescription(new RTCSessionDescription(answer));
          setStatus('✓ تم ربط الشاشة بنجاح تام!');
        });

        socket.on('candidate', async (candidate) => {
          if (pcRef.current && candidate) {
            try {
              await pcRef.current.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (e) {
              console.error(e);
            }
          }
        });

        return () => {
          socket.disconnect();
        };
      }, []);

      const createPeerConnection = () => {
        if (pcRef.current) return;

        const pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });

        pc.onicecandidate = (event) => {
          if (event.candidate && socketRef.current) {
            socketRef.current.emit('candidate', { room: roomId, candidate: event.candidate });
          }
        };

        pc.ontrack = (event) => {
          if (remoteVideoRef.current && event.streams[0]) {
            remoteVideoRef.current.srcObject = event.streams[0];
            setStatus('✓ عرض الشاشة الرئيسية للطرف الآخر جارٍ الآن!');
          }
        };

        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((track) => {
            pc.addTrack(track, localStreamRef.current);
          });
        }

        pcRef.current = pc;
      };

      const createRoom = () => {
        const generatedRoom = 'room_' + Math.random().toString(36).substring(2, 8);
        setRoomId(generatedRoom);
        socketRef.current.emit('join', generatedRoom);
      };

      const joinRoom = () => {
        if (!inputRoom.trim()) {
          alert('اكتب اسم الغرفة أولاً!');
          return;
        }
        setRoomId(inputRoom.trim());
        socketRef.current.emit('join', inputRoom.trim());
      };

      const startSharing = async () => {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always", frameRate: 30 },
            audio: true
          });

          localStreamRef.current = stream;
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = stream;
          }
          setIsStreaming(true);
          setStatus('✓ شاشتك جاهزة للبث في الغرفة.');

          await createPeerConnection();
          const offer = await pcRef.current.createOffer();
          await pcRef.current.setLocalDescription(offer);
          socketRef.current.emit('offer', { room: roomId, offer });

          stream.getVideoTracks()[0].onended = () => {
            stopSharing();
          };
        } catch (err) {
          console.error(err);
          setStatus('تم إلغاء إذن مشاركة الشاشة.');
        }
      };

      const stopSharing = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(t => t.stop());
          localStreamRef.current = null;
        }
        setIsStreaming(false);
        setStatus('تم إيقاف البث.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          <header className="glass-box border-b border-slate-800 p-4 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg neon-border">
                  🛰️
                </div>
                <div>
                  <h1 className="text-xs font-black text-white">ScreenCast WebSocket Free</h1>
                  <p className="text-[10px] text-slate-400">هندسة: <strong className="text-indigo-300">يوسف فرج</strong></p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className="bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs px-3 py-1.5 rounded-xl font-bold">
                  الغرفة الحالية: {roomId || 'غير متصل'}
                </span>
              </div>
            </div>
          </header>

          <div className="bg-slate-900/60 border-b border-slate-900 px-6 py-2">
            <div className="max-w-7xl mx-auto text-xs font-mono text-slate-400 text-center">
              الحالة: <strong className="text-emerald-400">{status}</strong>
            </div>
          </div>

          <main className="flex-1 flex flex-col items-center justify-center p-6 gap-6">
            
            {/* أزرار إنشاء والانضمام للغرفة */}
            <div className="w-full max-w-xl bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col gap-4 shadow-xl">
              <div className="flex gap-2">
                <button onClick={createRoom} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-3 rounded-xl font-bold transition shadow">
                  ✨ إنشاء غرفة جديدة
                </button>
              </div>
              <div className="flex gap-2">
                <input 
                  type="text" 
                  placeholder="أدخل اسم الغرفة للانضمام..." 
                  value={inputRoom}
                  onChange={(e) => setInputRoom(e.target.value)}
                  className="flex-1 bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-xl text-xs text-white font-mono focus:outline-none focus:border-indigo-500"
                />
                <button onClick={joinRoom} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-5 py-2.5 rounded-xl font-bold transition shadow">
                  🔗 انضمام
                </button>
              </div>

              {roomId && !isStreaming && (
                <button onClick={startSharing} className="w-full bg-rose-600 hover:bg-rose-500 text-white text-xs py-3 rounded-xl font-bold transition shadow-lg animate-pulse">
                  📡 بدء مشاركة وبث الشاشة في الغرفة
                </button>
              )}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-5xl">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col shadow-xl">
                <span className="text-xs font-bold text-indigo-400 mb-2">📱 شاشتك المحلية</span>
                <div className="w-full h-[280px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={localVideoRef} autoPlay playsInline muted className="w-full h-full object-contain"></video>
                  {!isStreaming && (
                    <div className="absolute inset-0 flex items-center justify-center bg-slate-950/80 p-4 text-center text-xs text-slate-400">
                      أنشئ غرفة أو انضم لها، ثم اضغط بدء البث.
                    </div>
                  )}
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col shadow-xl">
                <span className="text-xs font-bold text-emerald-400 mb-2">💻 الشاشة المستقبِلة</span>
                <div className="w-full h-[280px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-contain"></video>
                  <div className="absolute inset-0 flex items-center justify-center bg-slate-950/80 p-4 text-center text-xs text-slate-400">
                    ستظهر شاشة الطرف الآخر هنا فور اتصاله بالغرفة.
                  </div>
                </div>
              </div>
            </div>
          </main>

          <footer className="glass-box border-t border-slate-800 p-4 text-center text-xs text-slate-400">
            تطوير وهندسة الاتصال المجاني: <strong className="text-white">يوسف فرج</strong>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
