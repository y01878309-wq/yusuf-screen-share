<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenCast PeerJS Live Mirror | يوسف فرج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- مكتبة PeerJS للاتصال الحقيقي المباشر بين الأجهزة عبر الإنترنت -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #020617; color: #f8fafc; }
    .neon-border { border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 0 35px rgba(99, 102, 241, 0.25); }
    .glass-box { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [roomId, setRoomId] = useState('');
      const [peerId, setPeerId] = useState('جاري الاتصال بالشبكة...');
      const [remotePeerId, setRemotePeerId] = useState('');
      const [connectionStatus, setConnectionStatus] = useState('في انتظار الانضمام للغرفة...');
      const [isStreaming, setIsStreaming] = useState(false);

      const peerRef = useRef(null);
      const localStreamRef = useRef(null);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const currentCallRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        let currentRoom = params.get('room');
        
        if (!currentRoom) {
          currentRoom = 'youssef_room_' + Math.random().toString(36).substring(2, 8);
          const newUrl = window.location.origin + window.location.pathname + '?room=' + currentRoom;
          window.history.replaceState({ room: currentRoom }, '', newUrl);
        }
        setRoomId(currentRoom);

        // إنشاء كينونة PeerJS باستخدام معرف الغرفة لضمان اتصال الجهازين ببعض
        const peer = new Peer(currentRoom, {
          config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (id) => {
          setPeerId(id);
          setConnectionStatus('متصل بشبكة الإشارة وجاهز للبث');
        });

        // استقبال المكالمة والبث من الجهاز الآخر تلقائياً
        peer.on('call', (call) => {
          setConnectionStatus('جاري استلام البث الشاشي من الجهاز الثاني...');
          navigator.mediaDevices.getUserMedia({ video: true, audio: true }).catch(() => null).then(() => {
            call.answer(); // الرد على المكالمة بدون كاميرا محلية للمستقبل
            call.on('stream', (remoteStream) => {
              if (remoteVideoRef.current) {
                remoteVideoRef.current.srcObject = remoteStream;
                setConnectionStatus('✓ الشاشة الرئيسية معروضة بنجاح وبث مباشر نشط!');
                setIsStreaming(true);
              }
            });
          });
          currentCallRef.current = call;
        });

        peer.on('error', (err) => {
          console.error(err);
          // إذا كان معرف الغرفة مأخوذ (الجهاز الأول موجود)، نحاول الاتصال به كعميل
          if (err.type === 'unavailable-id') {
            setConnectionStatus('الغرفة نشطة بالفعل، جاري الاتصال بالجهاز المُضيف...');
            connectToHost(currentRoom);
          } else {
            setConnectionStatus('خطأ في الشبكة: ' + err.type);
          }
        });

        peerRef.current = peer;

        return () => {
          peer.destroy();
        };
      }, []);

      // الاتصال بالمضيف (الجهاز الأول)
      const connectToHost = (hostId) => {
        const peer = peerRef.current;
        if (!peer) return;

        navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true }).then((stream) => {
          localStreamRef.current = stream;
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = stream;
          }

          setConnectionStatus('جاري إرسال الشاشة الرئيسية للجهاز الآخر...');
          const call = peer.call(hostId, stream);
          
          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) {
              remoteVideoRef.current.srcObject = remoteStream;
            }
          });

          setIsStreaming(true);
          setConnectionStatus('✓ تم بدء بث الشاشة الرئيسية بنجاح!');

          stream.getVideoTracks()[0].onended = () => {
            stopBroadcast();
          };
        }).catch(err => {
          console.error(err);
          setConnectionStatus('تم إلغاء إذن مشاركة الشاشة.');
        });
      };

      // بدء مشاركة الشاشة يدوياً لمن يفتح الرابط
      const startManualBroadcast = () => {
        const params = new URLSearchParams(window.location.search);
        let hostId = params.get('room');
        // إذا كان هناك جهاز آخر نتصل به، أو نبدأ كمضيف وننتظر
        navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true }).then((stream) => {
          localStreamRef.current = stream;
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = stream;
          }
          setIsStreaming(true);
          setConnectionStatus('✓ شاشتك قيد البث وجاهزة للظهور عند الطرف الآخر.');

          // لو فيه شخص متصل بينا نبعتله البث
          if (peerRef.current) {
            peerRef.current.on('call', (call) => {
              call.answer(stream);
            });
          }

          stream.getVideoTracks()[0].onended = () => {
            stopBroadcast();
          };
        }).catch(err => {
          alert('يرجى السماح بمشاركة الشاشة لبدء البث.');
        });
      };

      const stopBroadcast = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(t => t.stop());
          localStreamRef.current = null;
        }
        setIsStreaming(false);
        setConnectionStatus('تم إيقاف البث.');
      };

      const inviteUrl = window.location.origin + window.location.pathname + '?room=' + roomId;

      const copyInvite = () => {
        navigator.clipboard.writeText(inviteUrl);
        alert('تم نسخ رابط الغرفة الفريدة بنجاح!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* Header */}
          <header className="glass-box border-b border-slate-800 p-4 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg neon-border">
                  🛰️
                </div>
                <div>
                  <h1 className="text-sm font-black text-white">ScreenCast PeerJS Live Mirror</h1>
                  <p className="text-xs text-slate-400">هندسة: <strong className="text-indigo-300">يوسف فرج</strong></p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-bold">
                  الغرفة: {roomId}
                </span>
                <button onClick={copyInvite} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-bold shadow">
                  🔗 نسخ الرابط
                </button>
              </div>
            </div>
          </header>

          {/* Status Bar */}
          <div className="bg-slate-900/60 border-b border-slate-900 px-6 py-2">
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs font-mono text-slate-400">
              <div>حالة الاتصال الفعلي: <strong className="text-emerald-400">{connectionStatus}</strong></div>
              <div>معرف الجهاز: <strong className="text-indigo-300">{peerId}</strong></div>
            </div>
          </div>

          {/* Main Workspace */}
          <main className="flex-1 flex items-center justify-center p-6">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full max-w-5xl">
              
              {/* شاشة هاتفك (المرسل) */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col shadow-xl">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-indigo-400">📱 شاشة هاتفك (المصدر للبث)</span>
                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                </div>

                <div className="w-full h-[360px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={localVideoRef} autoPlay playsInline muted className="w-full h-full object-contain"></video>
                  {!isStreaming && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-6 text-center">
                      <span className="text-4xl mb-3">📡</span>
                      <p className="text-xs text-slate-300 mb-4">اضغط هنا لبدء بث شاشتك الحقيقية لتظهر مباشرة عند الجهاز الثاني.</p>
                      <button onClick={startManualBroadcast} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-6 py-3 rounded-xl font-bold shadow-lg transition">
                        بدء بث الشاشة الحقيقي
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* الشاشة الرئيسية المستقبلة (التي تعرض تليفون الطرف الآخر) */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col shadow-xl">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-emerald-400">💻 الشاشة الرئيسية (تظهر هنا شاشة الطرف الآخر)</span>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>

                <div className="w-full h-[360px] bg-black rounded-2xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                  <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-contain"></video>
                  <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-6 text-center pointer-events-none">
                    <span className="text-4xl mb-3">🖥️</span>
                    <p className="text-xs text-slate-400">ستظهر شاشة الهاتف الرئيسي للطرف الآخر هنا فور اتصاله بالغرفة.</p>
                  </div>
                </div>
              </div>

            </div>
          </main>

          {/* Footer */}
          <footer className="glass-box border-t border-slate-800 p-4 text-center text-xs text-slate-400">
            تطوير وهندسة الاتصال المباشر: <strong className="text-white">يوسف فرج</strong>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
