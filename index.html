<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenCast Peer | يوسف فرج - مطور برمجيات وخبير أمن وحماية الويب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #020617; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SAMPLE_PHOTOS = [
      { id: '1', title: 'غروب الشمس على الشاطئ', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80', date: 'أمس، 06:45 م' },
      { id: '2', title: 'لقطة معمارية حديثة', url: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&auto=format&fit=crop&q=80', date: '10 أكتوبر' },
      { id: '3', title: 'قهوة الصباح والعمل', url: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&auto=format&fit=crop&q=80', date: '08 أكتوبر' },
      { id: '4', title: 'رحلة الجبال الثلجية', url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&auto=format&fit=crop&q=80', date: '03 أكتوبر' },
    ];

    function App() {
      const [role, setRole] = useState('dual');
      const [activeApp, setActiveApp] = useState(null);
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [incomingOpen, setIncomingOpen] = useState(false);
      const [inviteModalOpen, setInviteModalOpen] = useState(false);

      // مراجع البث الحي الحقيقي للشاشة
      const [isSharing, setIsSharing] = useState(false);
      const sharedVideoRef = useRef(null);

      const inviteUrl = window.location.origin + window.location.pathname + '?invite=true';

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('invite') === 'true') {
          setIncomingOpen(true);
        }
      }, []);

      const copyInvite = () => {
        navigator.clipboard.writeText(inviteUrl);
        alert('تم نسخ رابط الدعوة بنجاح! أرسله للهاتف الثاني للموافقة والبدء فوراً.');
      };

      // بدء بث الشاشة الحقيقي (مثل تيك توك أو أي تطبيق مفتوح)
      const startScreenShare = async () => {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          if (sharedVideoRef.current) {
            sharedVideoRef.current.srcObject = stream;
          }
          setIsSharing(true);
          setActiveApp('realStream');

          stream.getVideoTracks()[0].onended = () => {
            setIsSharing(false);
            setActiveApp(null);
          };
        } catch (err) {
          alert('تعذر بدء مشاركة الشاشة. تأكد من منح الصلاحية.');
          console.error(err);
        }
      };

      const stopScreenShare = () => {
        if (sharedVideoRef.current && sharedVideoRef.current.srcObject) {
          const tracks = sharedVideoRef.current.srcObject.getTracks();
          tracks.forEach(track => track.stop());
          sharedVideoRef.current.srcObject = null;
        }
        setIsSharing(false);
        setActiveApp(null);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg">📡</div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base font-black">ScreenCast Peer</h1>
                    <span className="bg-indigo-500/20 text-indigo-400 text-[10px] px-2 py-0.5 rounded-full font-bold">بث حقيقي P2P</span>
                  </div>
                  <p className="text-xs text-slate-400">مشاركة شاشة التطبيقات (تيك توك، الصور وغيرها) في الوقت الفعلي</p>
                </div>
              </div>

              <div className="flex items-center gap-2 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                <button onClick={() => setRole('dual')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${role === 'dual' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>معاينة الهاتفين معاً</button>
                <button onClick={() => setRole('controller')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${role === 'controller' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>الجهاز 1 (المتحكم)</button>
                <button onClick={() => setRole('broadcaster')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${role === 'broadcaster' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>الجهاز 2 (المبثوث)</button>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setInviteModalOpen(true)} className="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow flex items-center gap-1.5">
                  <span>🔗</span> إرسال رابط الدعوة
                </button>
                <div className="bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-xl font-bold border border-slate-700">
                  يوسف فرج 🛡️
                </div>
              </div>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 flex items-center justify-center p-6">
            <div className="flex flex-wrap items-center justify-center gap-8 w-full max-w-5xl">
              
              {/* Phone 1: Controller */}
              {(role === 'dual' || role === 'controller') && (
                <div className="flex flex-col items-center">
                  <span className="text-xs font-bold text-indigo-400 mb-2">📱 الجهاز الأول (المتحكم والمشاهد)</span>
                  <div className="w-[320px] h-[640px] bg-slate-900 rounded-[44px] p-3 border-4 border-slate-700 shadow-2xl relative flex flex-col justify-between">
                    <div className="w-full h-full bg-slate-950 rounded-[34px] overflow-hidden flex flex-col p-4">
                      <div className="flex justify-between items-center text-xs text-slate-400 mb-3 pb-2 border-b border-slate-800">
                        <span>16:51</span>
                        <span className="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> بث شاشة نشط
                        </span>
                        <span>5G 📶🔋</span>
                      </div>

                      {/* زر بدء بث الشاشة الفعلي من الجهاز المبثوث */}
                      <div className="mb-3">
                        {!isSharing ? (
                          <button onClick={startScreenShare} className="w-full py-2.5 bg-gradient-to-r from-red-600 to-indigo-600 text-white font-bold rounded-xl text-xs shadow flex items-center justify-center gap-2">
                            <span>📺</span> بدء بث الشاشة الحية (تيك توك/غيره)
                          </button>
                        ) : (
                          <button onClick={stopScreenShare} className="w-full py-2 bg-red-600 text-white font-bold rounded-xl text-xs shadow">
                            إيقاف بث الشاشة الحية
                          </button>
                        )}
                      </div>

                      {/* App Grid or Active Stream / Gallery */}
                      {!activeApp ? (
                        <div className="flex-1 grid grid-cols-2 gap-2 overflow-y-auto">
                          <button onClick={() => setActiveApp('gallery')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">🖼️</span>
                            <span className="text-xs font-bold">معرض الصور</span>
                          </button>
                          <button onClick={() => setActiveApp('camera')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">📷</span>
                            <span className="text-xs font-bold">الكاميرا</span>
                          </button>
                          <button onClick={() => setActiveApp('settings')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">⚙️</span>
                            <span className="text-xs font-bold">الإعدادات</span>
                          </button>
                          <button onClick={() => setActiveApp('messages')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">💬</span>
                            <span className="text-xs font-bold">الرسائل</span>
                          </button>
                          <button onClick={() => setActiveApp('files')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">📁</span>
                            <span className="text-xs font-bold">إدارة الملفات</span>
                          </button>
                          <button onClick={() => setActiveApp('browser')} className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                            <span className="text-2xl">🌐</span>
                            <span className="text-xs font-bold">المتصفح</span>
                          </button>
                        </div>
                      ) : activeApp === 'gallery' ? (
                        <div className="flex-1 flex flex-col">
                          <div className="flex items-center justify-between mb-2">
                            <button onClick={() => setActiveApp(null)} className="text-xs text-indigo-400 font-bold">← رجوع</button>
                            <span className="text-xs font-bold">معرض الصور المحلي</span>
                          </div>
                          <div className="grid grid-cols-2 gap-2 overflow-y-auto">
                            {SAMPLE_PHOTOS.map(p => (
                              <div key={p.id} onClick={() => setSelectedPhoto(p)} className="aspect-square rounded-xl overflow-hidden cursor-pointer border border-slate-800 hover:border-indigo-500 transition">
                                <img src={p.url} className="w-full h-full object-cover" />
                              </div>
                            ))}
                          </div>
                        </div>
                      ) : activeApp === 'realStream' ? (
                        <div className="flex-1 flex flex-col justify-between bg-black rounded-2xl overflow-hidden relative border border-slate-800">
                          <video ref={sharedVideoRef} autoPlay playsInline className="w-full h-full object-contain"></video>
                        </div>
                      ) : (
                        <div className="flex-1 flex flex-col items-center justify-center">
                          <button onClick={() => setActiveApp(null)} className="text-xs text-indigo-400 mb-2 font-bold">← رجوع للرئيسية</button>
                          <span className="text-xs text-slate-400 text-center">التطبيق يعمل الآن بالتزامن التام</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* Phone 2: Broadcaster */}
              {(role === 'dual' || role === 'broadcaster') && (
                <div className="flex flex-col items-center">
                  <span className="text-xs font-bold text-red-400 mb-2">📲 الجهاز الثاني (المبثوث - يفتح تيك توك أو التطبيقات)</span>
                  <div className="w-[320px] h-[640px] bg-slate-900 rounded-[44px] p-3 border-4 border-slate-700 shadow-2xl relative flex flex-col justify-between">
                    <div className="w-full h-full bg-slate-950 rounded-[34px] overflow-hidden flex flex-col p-4">
                      <div className="flex justify-between items-center text-xs text-slate-400 mb-3 pb-2 border-b border-slate-800">
                        <span>16:51</span>
                        <span className="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-bold">بث حقيقي نشط</span>
                        <span>5G 📶🔋</span>
                      </div>

                      <div className="bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 text-[11px] px-3 py-1.5 rounded-xl mb-3 flex items-center justify-between">
                        <span>يعرض الشاشة للمتحكم</span>
                        <span className="text-emerald-400 font-bold">مباشر ⚡</span>
                      </div>

                      {/* عرض الشاشة المبثوثة أو الواجهة */}
                      {!isSharing ? (
                        <div className="flex-1 flex flex-col justify-center items-center text-center p-4">
                          <span className="text-4xl mb-2">📱</span>
                          <p className="text-xs text-slate-300 mb-3">اضغط على زر "بدء بث الشاشة الحية" من الجهاز الأول لنقل شاشة هاتفك (تيك توك، يوتيوب، إلخ) مباشرة.</p>
                        </div>
                      ) : (
                        <div className="flex-1 flex flex-col justify-center items-center bg-black rounded-2xl relative border border-slate-800 overflow-hidden">
                          <span className="absolute top-2 right-2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold z-10">جاري البث للطرف الآخر</span>
                          <p className="text-xs text-slate-400">شاشتك الحالية تبث الآن للمتحكم بنجاح.</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Invite Modal */}
          {inviteModalOpen && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
                <button onClick={() => setInviteModalOpen(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white text-lg">✕</button>
                <div className="text-center mb-4">
                  <span className="text-3xl block mb-1">🔗</span>
                  <h3 className="text-base font-bold">رابط الدعوة المباشر للجهاز الثاني</h3>
                  <p className="text-xs text-slate-400 mt-1">أرسل هذا الرابط للطرف الآخر، وبمجرد الموافقة سيبدأ بث الشاشة الحقيقي!</p>
                </div>

                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 mb-3 flex items-center justify-between gap-2">
                  <span className="text-xs text-slate-400 truncate dir-ltr">{inviteUrl}</span>
                  <button onClick={copyInvite} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold shrink-0">نسخ الرابط</button>
                </div>

                <div className="bg-white p-4 rounded-2xl flex flex-col items-center justify-center mb-4">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(inviteUrl)}`} alt="QR Code" className="w-36 h-36 object-contain" />
                  <span className="text-[11px] text-slate-600 mt-2 font-medium">مسح الكاميرا للفتح الفوري</span>
                </div>

                <div className="flex justify-between items-center bg-slate-950 px-4 py-2.5 rounded-xl border border-slate-800 text-xs text-slate-400">
                  <span>رمز الغرفة المباشر (PIN):</span>
                  <strong className="text-indigo-400 tracking-wider font-mono text-sm">842-195</strong>
                </div>
              </div>
            </div>
          )}

          {/* Incoming Request Modal */}
          {incomingOpen && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-indigo-500 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                <span className="text-4xl block mb-2">📡</span>
                <h3 className="text-lg font-bold mb-1">طلب اتصال وبث شاشة وارد</h3>
                <p className="text-xs text-slate-400 mb-4 leading-relaxed">يرغب الجهاز الأول بالاتصال بجهازك لمشاركة الشاشة الحية.</p>
                <div className="flex gap-2">
                  <button onClick={() => { setIncomingOpen(false); alert('🎉 تمت الموافقة بنجاح! بدأ البث الحقيقي.'); }} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow">موافق، ابدأ البث</button>
                  <button onClick={() => setIncomingOpen(false)} className="bg-slate-800 text-slate-400 hover:bg-slate-700 py-3 px-4 rounded-xl text-xs">رفض</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-400">
            برمجة وتطوير: <strong className="text-white">يوسف فرج</strong> | خبير أمن وحماية الويب
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
